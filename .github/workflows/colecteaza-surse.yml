name: Colecteaza sursele pentru digest

# Ruleaza luni cu o ora inaintea routine-ului (06:00 UTC), de pe serverele GitHub,
# care pot citi si site-urile ce refuza cererile din mediul cloud (Wall-Street,
# Capital, BZI). Rezultatul ajunge in colectare/colectare.md, pe care routine-ul
# il foloseste ca punct de plecare. Nu trimite niciun email.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  colecteaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Colecteaza feed-urile si paginile HoReCa/food
        run: |
          mkdir -p colectare
          python .claude/skills/weekly-horeca-digest/scripts/colecteaza.py --pagini > colectare/colectare.md

      - name: Salveaza in repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add colectare/colectare.md
          if git diff --cached --quiet; then
            echo "Nimic nou."
          else
            git commit -m "Colectare surse $(TZ=Europe/Bucharest date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi
